# Copy this file to config.yaml and review EVERY value before setting
# dry_run to false. These defaults are deliberately conservative
# placeholders, not a recommendation - they exist so the bot has *some*
# limit instead of none. You are trading real money; read this file.
#
# Strategy this is tuned for ("Mr. Michael"): low-priced, tiny-market-cap,
# low-float US stocks suddenly moving hard on abnormal volume - social
# chatter, a weak catalyst, short covering, or no clear reason at all.
# Same-day only, no overnight holds.

# --- Safety switch -----------------------------------------------------
# While true, the bot does everything except actually submit orders:
# it scans, logs what it *would* have done, and tracks paper P&L.
# Flip to false only once you've reviewed the numbers below.
dry_run: true

# --- Account -------------------------------------------------------------
# Your current account equity, in dollars. Used to size positions and to
# compute the daily loss kill-switch as a percentage of equity. Update
# this if your account balance changes materially - it is not read live
# from Robinhood on every cycle.
account_equity_usd: 2000

# --- Risk limits (the kill switch) ---------------------------------------
# Once realized + open unrealized loss for the day reaches this fraction
# of account_equity_usd, the bot stops opening new positions for the rest
# of the day. Existing positions are still managed (stop/trailing/EOD exit).
daily_loss_limit_pct: 0.03        # 3% of account equity

# Max dollars committed to a single new position.
max_position_size_usd: 100

# Max dollars committed across ALL open positions at once.
max_total_deployed_usd: 300

# Max number of positions open at the same time.
max_concurrent_positions: 3

# Max number of new entries the bot will make in one day (each re-entry
# into a symbol that ignites a second time counts against this too).
# Prevents runaway overtrading on a noisy day.
max_trades_per_day: 12

# --- Exit rules (per position, software-managed - see README) ------------
# Hard floor: always exit if a position moves against you this much,
# no matter what else is happening.
stop_loss_pct: 0.12

# Primary exit for winners: sell once price has given back this much off
# its PEAK since entry, not a fixed target - lets a real leader keep
# running instead of capping it artificially, while still locking in
# gains once it rolls over.
trailing_giveback_pct: 0.15

# Outer safety cap. Optional extra ceiling in case you want one on top of
# the trailing exit; set to something like 5.0 (500%) to effectively
# disable it and let the trailing exit do all the work.
take_profit_cap_pct: 2.0

# Distribution detection: exit if the pace of buying (shares/sec) has
# dropped to this fraction below its own peak since entry, WHILE price
# has stalled (see change_pct <= 2% check in main.py) - i.e. the crowd
# that was pushing this thing up has stopped showing up.
distribution_volume_drop_pct: 0.5   # peak rate dropping 50%+ counts as drying up

# Force-flatten any open position by this time (US/Eastern, 24h). Same-day
# only - never hold a runner overnight.
force_exit_time_et: "15:55"

# --- Scanner / entry criteria ---------------------------------------------
# "Runner" = a low-priced stock moving hard, fast, on volume - momentum/
# chatter driven, not fundamentals.
scan_interval_seconds: 60
price_min_usd: 0.30
price_max_usd: 5.00          # core range is ~$0.30-$3; extends to $5 for strong movers
min_intraday_gain_pct: 0.15  # initial trigger: must be up >= 15% today
min_relative_volume: 3.0     # today's volume vs its average volume

# Continuation / "second wave" check - a name already up 100%+ today is
# NOT automatically too late; it's disqualified only if it looks stalled
# right now. Once a symbol has enough scan history, it must show at least
# this much price movement AND this much volume over the last N cycles,
# or it's treated as stalling and skipped even if the day's total gain is
# huge.
momentum_lookback_cycles: 3          # ~3 scan cycles back (3 min @ 60s default)
min_recent_price_change_pct: 0.03    # >= 3% move within that window
min_recent_volume_shares: 5000       # >= this many shares traded in that window

# Only look for NEW entries inside this US/Eastern window. Outside it the
# bot still manages/exits existing positions but won't open new ones.
# Left wide open (not just the first hour) since a runner can ignite, fade,
# and reignite for a second wave later in the session.
entry_window_start_et: "09:30"
entry_window_end_et: "15:45"

# --- Additional sources / "the whole picture" -----------------------------
# Robinhood's top-movers list alone is a small curated set. These widen the
# universe and add a real chatter signal, closer to how a human scans
# multiple places before acting.

# Best-effort secondary universe from the unofficial `webull` package.
# Off by default - see src/webull_source.py for why, and what to check
# before turning it on.
enable_webull_source: false

# Social chatter signal from StockTwits' public API (see src/social_signal.py).
# This is a SCORING input, not a hard requirement - per the strategy, some
# runners have no visible catalyst at all.
enable_social_signal: true

# --- Composite conviction score --------------------------------------------
# Candidates are ranked by a weighted score instead of raw day-gain alone,
# so the bot picks the strongest overall setup first when several
# candidates qualify at once. Tune these weights to taste; they're
# deliberately scaled so no single component dominates by default given
# typical magnitudes (gain_pct ~0.15-2+, relative_volume ~3-20+,
# recent price change ~0.03-0.5+, buzz message count is capped at 1.0
# internally before weighting).
weight_gain: 1.0
weight_relvol: 0.05
weight_continuation: 2.0
weight_buzz: 0.5
weight_float_turnover: 1.0   # weight applied to rotations_since_open (day_turnover) in the score

# --- Effective float (src/float_data.py, src/float_metrics.py) ------------
# "Low effective float" is core to this strategy but Robinhood/Webull don't
# reliably expose it - this pulls it from a real financial-data API instead.
# Requires an API key in .env: FMP_API_KEY (recommended primary) or
# ALPHA_VANTAGE_API_KEY. Get a free key at financialmodelingprep.com
# (250 req/day free tier - plenty, since float is cached, not re-fetched
# every scan cycle) or alphavantage.co (25 req/day free tier).
float_provider: "fmp"          # "fmp" or "alpha_vantage"
float_cache_ttl_hours: 48      # float rarely changes; don't re-fetch every cycle
float_staleness_days_threshold: 45   # flag if the provider's own as-of date is older than this

# Optional: also fetch from the OTHER provider once per cache refresh and
# flag when the two disagree by more than this fraction. Needs both API
# keys set. Off by default to save API calls.
float_cross_check: false
float_disagreement_pct_threshold: 0.25

# If true, a candidate whose float can't be verified (missing, stale, or
# sources disagree) is skipped entirely rather than just scored without a
# turnover boost. Off by default - many legitimate penny-stock issuers
# have thin/delayed float reporting; this only matters if you want to be
# strict about it.
require_valid_float: false

# Optional hard float-size filter, in shares. Leave unset (or remove) to
# not filter on float size at all - candidates with unknown float still
# pass every other check either way.
# min_float_shares: 1000000
# max_float_shares: 20000000

# --- Level II (src/level2.py) ----------------------------------------------
# Robinhood Gold's Nasdaq order book (get_pricebook_by_symbol) - needs an
# active Gold subscription ($5/mo) on the logged-in account. Nasdaq-listed
# symbols only; NYSE/OTC candidates just won't have this data, which is
# fine, not an error. This is a depth/spread snapshot, not a streaming
# tape - see README for what a real market-data vendor would add on top.
enable_level2: true

# Hard gate: skip a candidate if its top-of-book spread is wider than
# this fraction of the ask. Entries are limit orders just above the ask
# (executor.py) - a wide spread is a real execution-quality problem, not
# just a scoring nitpick.
max_spread_pct: 0.15

# Weight applied to bid/ask size imbalance in the composite score
# (positive = more size stacked on the bid than the ask).
weight_l2_imbalance: 0.5

# --- Market cap ---------------------------------------------------------
# Computed for free from price x shares_outstanding (already fetched for
# float). "Tiny market cap" is mostly already implied by price/float
# bounds above; this is an optional extra ceiling, not a new score input.
# max_market_cap_usd: 50000000

# --- RSI (src/technical_indicators.py) --------------------------------
# Computed locally from Robinhood's own intraday candles - no separate
# API/vendor needed. A momentum-CONFIRMATION input (higher RSI nudges the
# score up), not an "overbought, avoid" filter - consistent with the
# strategy's own framing that a stock isn't automatically too late.
enable_rsi: true
weight_rsi: 0.5
